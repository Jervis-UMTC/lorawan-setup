# ChirpStack v4 Configuration

[logging]
  level = "info"

[postgresql]
  dsn = "postgres://chirpstack:chirpstack@postgres/chirpstack?sslmode=disable"
  max_open_connections = 10

[redis]
  url = "redis://redis:6379"

[network]
  net_id = "000000"
  enabled_regions = [
    "eu868",
    "us915_0",
    "as923"
  ]

[api]
  bind = "0.0.0.0:8080"
  secret = "very-secret-key-change-in-production"

[integration]
  enabled = ["mqtt"]

  [integration.mqtt]
    server = "tcp://mosquitto:1883"
    json = true
